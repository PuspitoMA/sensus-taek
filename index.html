<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensus Taek — Daftar Data</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <div id="daftarView">
      <div class="halaman-hasil-header">
        <div class="kop">Halaman Hasil</div>
        <h1>Daftar Kartu Keluarga Tersimpan</h1>
      </div>

      <nav class="quick-nav" id="petugasTabs" aria-label="Filter petugas">
        <a href="#" class="tab-petugas active" data-val="all">Semua</a>
        <a href="#" class="tab-petugas" data-val="Mb Anwar">Mb Anwar</a>
        <a href="#" class="tab-petugas" data-val="Mb Weny">Mb Weny</a>
      </nav>

      <div class="section" data-tag="Daftar" id="daftarSection">
        <div id="loading" class="empty-note">Memuat data...</div>
        <div id="tabelKosong" class="empty-note" style="display:none;">Belum ada data yang disimpan.</div>

        <div class="table-wrap">
          <table class="tabel-daftar" id="tabelDaftar" style="display:none;">
            <thead>
              <tr>
                <th>Nama Kartu Keluarga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelDaftarBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/daftar.js"></script>
</body>
</html>
